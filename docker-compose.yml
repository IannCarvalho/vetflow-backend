version: '3.8'

services:
  vetflow-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Set SEED_FORCE=true in the shell to force a clean re-seed on startup.
      SEED_FORCE: "${SEED_FORCE:-false}"
      # JWT signing secret. REQUIRED in every environment — the app refuses to
      # start without it (no dev fallback). Set JWT_SECRET in your .env / host env.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
    restart: unless-stopped
