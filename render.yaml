services:
  - type: web
    name: vetflow-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGO_URI
        value: ***REMOVED_CONNECTION_STRING***
      - key: MONGO_DB
        value: vetflow
      - key: PORT
        value: "8080"
    autoDeploy: true
