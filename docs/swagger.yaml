      cpf:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  models.Consultation:
    properties:
      anamnesis:
        $ref: '#/definitions/models.Anamnesis'
      created_at:
        type: string
      date:
        type: string
      diet:
        $ref: '#/definitions/models.Diet'
      id:
        type: string
      pet_id:
        type: string
      physiological:
        $ref: '#/definitions/models.Physiological'
      summary:
        $ref: '#/definitions/models.Summary'
      vet_name:
        type: string
    type: object
  models.Diet:
    properties:
      amount_and_frequency:
        type: string
      diet_changed_recently:
        type: boolean
      food_type:
        type: string
      normal_water_intake:
        type: boolean
    type: object
  models.Pet:
    properties:
      age:
        type: integer
      age_unit:
        type: string
      breed:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      neutered:
        type: boolean
      owner_id:
        type: string
      sex:
        type: string
      species:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  models.Physiological:
    properties:
      normal_urine_feces:
        type: boolean
      respiratory_issues:
        type: boolean
      vomiting:
        type: boolean
    type: object
  models.Summary:
    properties:
      environment_and_contacts:
        type: string
      evolution_time:
        type: string
      feces_urine:
        type: string
      feeding:
        type: string
      main_complaint:
        type: string
      medications:
        type: string
      vaccines_and_deworming:
        type: string
    type: object
  models.Vaccine:
    properties:
      batch:
        type: string
      created_at:
        type: string
      date_applied:
        type: string
      id:
        type: string
      manufacturer:
        type: string
      next_dose_date:
        type: string
      notes:
        type: string
      pet_id:
        type: string
      vaccine_name:
        type: string
      vet_name:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io
host: localhost:8080
info:
  contact:
    email: support@vetflow.local
    name: API Support
    url: http://www.swagger.io/support
  description: Complete REST API for managing veterinary clinics, clients, pets, consultations
    and vaccines.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: VetFlow - Veterinary Management API
  version: "1.0"
paths:
  /clients:
    get:
      consumes:
      - application/json
      description: Retrieve all registered clients
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Client'
            type: array
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all clients
      tags:
      - Clients
    post:
      consumes:
      - application/json
      description: Create a new veterinary clinic client
      parameters:
      - description: Client object
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/models.Client'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Client'
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new client
      tags:
      - Clients
  /clients/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a client by ID
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Client not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete client
      tags:
      - Clients
    get:
      consumes:
      - application/json
      description: Get a specific client by their ID
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
