basePath: /
definitions:
  models.Address:
    properties:
      complement:
        type: string
      number:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  models.Anamnesis:
    properties:
      behavior_change:
        type: boolean
      evolution_time:
        type: string
      happened_before:
        type: boolean
      main_complaint:
        type: string
      pain:
        type: boolean
      prior_vet_visit:
        type: boolean
      symptom_frequency:
        type: string
      symptoms_worsened:
        type: boolean
    type: object
  models.Client:
    properties:
      address:
