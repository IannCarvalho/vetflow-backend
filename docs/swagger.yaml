          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get client by ID
      tags:
      - Clients
    put:
      consumes:
      - application/json
      description: Update an existing client
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated client object
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/models.Client'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Client'
        "400":
