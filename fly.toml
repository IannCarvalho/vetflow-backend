app = "vetflow-backend"
primary_region = "sfo"

[env]
  MONGO_URI = "***REMOVED_CONNECTION_STRING***"
  MONGO_DB = "vetflow"
  PORT = "8080"

[build]
  builder = "docker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
